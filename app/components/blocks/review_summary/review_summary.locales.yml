# Blocks::ReviewSummary strings - t(".key") in any of its parts looks here.
# Every language in one file; add a locale as another top-level key with the same keys
# (test/components/locales_test.rb checks that they match; plural forms may differ per language).
en:
  ui_components:
    blocks:
      review_summary:
        reviews:
          one: "%{formatted} review"
          other: "%{formatted} reviews"
        verified_reviews:
          one: "%{formatted} verified review"
          other: "%{formatted} verified reviews"
        stars:
          one: "%{count} star reviews"
          other: "%{count} star reviews"
cs:
  ui_components:
    blocks:
      review_summary:
        reviews:
          one: "%{formatted} recenze"
          few: "%{formatted} recenze"
          many: "%{formatted} recenze"
          other: "%{formatted} recenzí"
        verified_reviews:
          one: "%{formatted} ověřená recenze"
          few: "%{formatted} ověřené recenze"
          many: "%{formatted} ověřené recenze"
          other: "%{formatted} ověřených recenzí"
        stars:
          one: "Recenze s %{count} hvězdičkou"
          few: "Recenze se %{count} hvězdičkami"
          many: "Recenze s %{count} hvězdičkami"
          other: "Recenze s %{count} hvězdičkami"
