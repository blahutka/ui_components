# AppicaUI::Blocks::OrderTracker strings - t(".key") in any of its parts looks here.
# Every language in one file; add a locale as another top-level key with the same keys
# (test/components/locales_test.rb checks that they match; plural forms may differ per language).
en:
  ui_components:
    appica_ui:
      blocks:
        order_tracker:
          title: "Order #%{number}"
          summary:
            one: "%{formatted} item · %{total}"
            other: "%{formatted} items · %{total}"
          progress: Delivery progress
          timeline: Shipment progress
          statuses:
            processing: Processing
            shipped: Shipped
            in_transit: In transit
            out_for_delivery: Out for delivery
            delivered: Delivered
            delayed: Delayed
          steps:
            confirmed: Order confirmed
            shipped: Packed & shipped
            sorting_hub: Arrived at sorting hub
            local_facility: At local courier facility
            out_for_delivery: Out for delivery
            delivered: Delivered
          when:
            today: "Today, %{time}"
            yesterday: "Yesterday, %{time}"
            date: "%{date}, %{time}"
          eta: "ETA %{time}"
          formats:
            date: "%b %-d"
            time: "%-l:%M %p"
          courier:
            on_the_way: "%{name} is on the way"
            stops:
              one: "%{formatted} stop away"
              other: "%{formatted} stops away"
            track: Track on map
